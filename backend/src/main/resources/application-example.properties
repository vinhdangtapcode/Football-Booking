# Example application.properties for Football Booking project
# Copy this file to application.properties and fill in your real credentials

spring.datasource.url=jdbc:postgresql://localhost:5432/FootballField
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.http.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
server.servlet.encoding.force-response=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

jwt.secret=your_jwt_secret
jwt.expiration=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google OAuth Configuration
# Get your Client ID from Google Cloud Console: https://console.cloud.google.com/
google.client.id=your_google_client_id_here

# File Upload Configuration
file.upload-dir=uploads/field-images
# Cấu hình địa chỉ để máy khách (Client) truy cập ảnh tĩnh:
# - Android Emulator: http://10.0.2.2:8080
# - iOS Simulator / Web / Chạy nội bộ: http://localhost:8080
# - Thiết bị thật chạy chung mạng Wi-Fi: http://<IP_MÁY_TÍNH>:8080
# - Production (Cloud Server): http://<IP_SERVER_HOẶC_DOMAIN>
file.base-url=http://10.0.2.2:8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# PayOS Configuration (Get your credentials from https://payos.vn/)
payos.client-id=your_payos_client_id_here
payos.api-key=your_payos_api_key_here
payos.checksum-key=your_payos_checksum_key_here


